server:
  port: 8081
spring:
  application:
    name: event-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/event_db}
    username: ${DB_USERNAME:eventflow}
    password: ${DB_PASSWORD:eventflow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 300000
management:
  endpoints:
    web:
      exposure:
        include: health,info
